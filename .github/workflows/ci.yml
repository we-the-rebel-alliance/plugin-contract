name: CI

# One job, named ci: the org ruleset requires a check with that name. Every gate runs as a step inside it, so the
# required check covers all of them: typecheck, build, the committed dist/, Node 24 and Node 22 tests, Bun loading and
# tests, the conformance self-test, the release files and actionlint.
#
# It runs locally too: npm ci --ignore-scripts && npm run check
#
# Public repository: a pull request from a fork must never reach a self-hosted runner. The runner rule below keeps
# every fork pull request on ubuntu-24.04, and lets this repository's own runs use the org's public runner when set.

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: npm ci --ignore-scripts
      - name: actionlint
        run: |
          set -euo pipefail
          version=1.7.12
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          curl -sSfLO "${base}/actionlint_${version}_linux_amd64.tar.gz"
          curl -sSfLO "${base}/actionlint_${version}_checksums.txt"
          grep " actionlint_${version}_linux_amd64.tar.gz$" "actionlint_${version}_checksums.txt" | sha256sum -c -
          tar xzf "actionlint_${version}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
      - run: npm run check
      - name: dist/ is current
        run: |
          git diff --exit-code -- dist
          test -z "$(git status --porcelain -- dist)"
      - run: npm run test:bun
      - name: Release files (dry run)
        run: node scripts/release.mjs --dry-run
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm run test:node
